name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The real proof the app still builds. It also catches a bad import or a
      # missing asset, which typecheck alone does not.
      - name: Bundle for web
        run: npx expo export --platform web
        env:
          CI: "1"

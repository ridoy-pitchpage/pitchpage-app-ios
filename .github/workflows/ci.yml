name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The real proof the app still builds. It also catches a bad import or a
      # missing asset, which typecheck alone does not.
      - name: Bundle for web
        run: npx expo export --platform web
        env:
          CI: "1"

      # And the proof it still WORKS: every screen rendered and driven in a
      # real browser against stubbed data. e2e/run.sh bundles and serves the
      # app itself, so this needs no account and no network.
      - name: Install Chromium for the e2e run
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npm run e2e

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: .e2e-out/
          if-no-files-found: ignore
